name: Build

# Builds the game library for macOS (universal: Apple Silicon and Intel), for shipping.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_TAG: "2026.07.29"

jobs:
  macos:
    name: macOS release library
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Build universal extension
        run: |
          cmake --preset macos-release
          cmake --build --preset macos-release
          lipo -info game/bin/*.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: engine5-macos-template_release
          path: game/bin/*.dylib
          if-no-files-found: error
